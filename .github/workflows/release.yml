name: Release

# Au push d'un tag vX.Y.Z : tests, compilation de RKarrousel.exe et de l'installateur Windows (Inno Setup),
# test d'installation silencieuse, puis ajout de RKarrousel-vX.Y.Z.exe et RKarrousel-Setup-vX.Y.Z.exe à la
# release GitHub (créée si elle n'existe pas).
# Lancement manuel (workflow_dispatch) : mêmes étapes sans publication, l'installateur est gardé en artefact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Build RKarrousel.exe
        shell: cmd
        run: build_windows.bat

      - name: Smoke test (the exe must build its whole UI)
        timeout-minutes: 2
        shell: bash
        run: |
          dist/RKarrousel.exe --smoke-test smoke.txt
          for i in $(seq 1 20); do [ -f smoke.txt ] && break; sleep 1; done
          cat smoke.txt
          grep -q "^ok" smoke.txt
          grep -q "logo=yes" smoke.txt  # le logo doit être embarqué dans l'exécutable

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "from rkarrousel.version import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à rkarrousel/version.py ($VERSION)"; exit 1
          fi

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\RKarrousel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer test (silent install, default config, uninstall)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\RKarrousel-Setup-v${{ steps.ver.outputs.version }}.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP "rk_install"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/NOICONS","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\RKarrousel.exe")) { throw "RKarrousel.exe missing after install" }
          $cfg = Get-Content "$dir\.image_splitter_config.json" -Raw | ConvertFrom-Json
          if ($cfg.frame_ratio -ne 0.01 -or @("en","fr") -notcontains $cfg.language) { throw "default config not created as expected" }
          $smoke = Join-Path $env:RUNNER_TEMP "installed_smoke.txt"
          Start-Process "$dir\RKarrousel.exe" -ArgumentList "--smoke-test","`"$smoke`""
          for ($i = 0; $i -lt 30 -and -not (Test-Path $smoke); $i++) { Start-Sleep 1 }
          Get-Content $smoke
          if (-not ((Get-Content $smoke -Raw) -like "ok*logo=yes*")) { throw "installed app failed its smoke test" }

      - name: Uninstall test (informative, never blocks a release)
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "rk_install"
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP "uninstall.log"
          $p = Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=`"$log`"" -PassThru
          if (-not $p.WaitForExit(90000)) {
            Write-Host "Uninstaller still running after 90 s, log so far:"
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            Get-Process | Where-Object { $_.Name -like "*unins*" -or $_.Name -like "*RKarrousel*" } | Format-Table Name, Id
            $p.Kill()
            throw "uninstaller did not finish"
          }
          Write-Host "uninstaller exit code: $($p.ExitCode)"
          if (Test-Path "$dir\RKarrousel.exe") { throw "RKarrousel.exe still present after uninstall" }

      - name: Keep installer as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/RKarrousel-Setup-v*.exe

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp dist/RKarrousel.exe "dist/RKarrousel-${VERSION}.exe"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            if python tools/release_notes.py "$VERSION" > release_notes.md; then
              gh release create "$VERSION" --title "$VERSION" --notes-file release_notes.md
            else
              gh release create "$VERSION" --title "$VERSION" --generate-notes
            fi
          fi
          gh release upload "$VERSION" "dist/RKarrousel-${VERSION}.exe" "dist/RKarrousel-Setup-${VERSION}.exe" --clobber
